name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PG_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  test:
    name: Typecheck, unit + API tests (incl. race suite), web build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm -F @bw/shared test
      - name: API tests (race, idempotency, invites, requests, board, SSE, audit, …)
        run: pnpm -F @bw/api test
      - run: pnpm -F @bw/web test
      - run: pnpm -F @bw/web build

  load:
    name: Load test (k6, 100 VUs, 10k users / 2k teams)
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @bw/api build
      - name: Seed 10,000 users and 2,000 teams
        run: pnpm -F @bw/api seed --reset
      - name: Start API
        working-directory: apps/api
        run: |
          DEMO_MODE=true DEMO_LOGIN_LIMIT=100000 LOG_LEVEL=warn PORT=8080 node dist/src/server.js &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/readyz && break; sleep 1; done
      - uses: grafana/setup-k6-action@v1
      - name: Browse scenario (gate p95 < 200 ms)
        run: mkdir -p loadtest/out && k6 run -e BASE_URL=http://127.0.0.1:8080 -e DURATION=60s loadtest/board.k6.js
      - name: Hammer scenario (informational, no think time)
        continue-on-error: true
        run: k6 run -e BASE_URL=http://127.0.0.1:8080 -e SCENARIO=hammer -e DURATION=30s loadtest/board.k6.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-summaries
          path: loadtest/out/*.json

  chaos:
    name: Chaos test (SIGKILL mid-join ×6)
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @bw/api build
      - run: pnpm -F @bw/api chaos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-report
          path: docs/CHAOS.md
